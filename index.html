*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 "Cairo",Tahoma,Arial,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.side{background:var(--panel);border-left:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--primary),var(--primary2));display:grid;place-items:center;color:white;font-weight:900;font-size:19px}.brand b{font-size:15px;display:block}.brand small{color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:right;padding:11px 13px;border-radius:10px;color:var(--muted);display:flex;gap:12px;align-items:center}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:var(--accent);color:var(--primary2);font-weight:700}.ico{width:22px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;color:var(--muted);font-size:11px}.local{display:flex;gap:7px;align-items:center;color:var(--green);font-weight:700;margin-bottom:5px}.dot{width:7px;height:7px;background:currentColor;border-radius:50%}.main{min-width:0;padding:26px clamp(15px,3vw,38px) 45px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h1{font-size:23px;margin:0;letter-spacing:-.4px}.sub{color:var(--muted);margin-top:3px;font-size:12px}.toptools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.month{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px}.iconbtn{width:39px;height:39px;padding:0}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.soft{background:var(--accent);border-color:transparent;color:var(--primary2)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 16px}.pagehead h2{font-size:18px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.cards{display:grid;grid-template-columns:repeat( auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:21px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:15px 16px}.stat .label{font-size:12px;color:var(--muted)}.stat strong{font-size:25px;display:block;line-height:1.5;margin-top:4px}.stat .hint{font-size:11px;color:var(--muted)}.panel{padding:17px;margin-bottom:16px}.panel h3{margin:0 0 13px;font-size:15px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:780px}th{background:var(--panel2);color:var(--muted);font-size:11px;font-weight:700;padding:11px 9px;white-space:nowrap;text-align:center}td{padding:8px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap;font-size:12px}tbody tr:hover{background:var(--panel2)}td input,td select{width:100%;min-width:65px;padding:6px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:12px}td input.wide{min-width:125px}.money{color:var(--green);font-weight:800}.tag{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}.tag.ok{background:var(--greenbg);color:var(--green)}.tag.wait{background:var(--orangebg);color:var(--orange)}.tag.no{background:var(--redbg);color:var(--red)}.actions{display:flex;gap:6px;justify-content:center}.actions .btn{padding:5px 8px;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}.field{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:37px}.search{min-width:220px;flex:1}.empty{padding:30px;text-align:center;color:var(--muted)}.barrow{display:grid;grid-template-columns:110px 1fr 55px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.track{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--primary);border-radius:20px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formfield{display:grid;gap:5px}.formfield label{font-size:12px;color:var(--muted)}.formfield input,.formfield select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}.modalback{position:fixed;inset:0;background:#07131899;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 80px #0004}.modal h3{margin:0 0 15px}.modalfoot{display:flex;justify-content:flex-start;gap:8px;margin-top:18px}.toast{position:fixed;bottom:20px;left:20px;background:var(--text);color:var(--panel);padding:10px 15px;border-radius:10px;z-index:20;box-shadow:var(--shadow)}.hidden{display:none!important}.settingsrow{display:grid;grid-template-columns:1fr 110px 110px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.settingsrow input{width:100%;background:var(--panel);border:1px solid var(--line);padding:7px;border-radius:7px}.pilltabs{display:flex;gap:6px;flex-wrap:wrap}.pilltabs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px}.pilltabs button.active{background:var(--accent);color:var(--primary2);border-color:var(--accent)}.exportHero{background:linear-gradient(125deg,#073b4c,#087e8b 58%,#35a7a0);color:#fff;border:0;overflow:hidden;position:relative}.exportHero p{color:#e2f5f4}.exportHero .btn{background:#fff;color:#075b67;border-color:#fff;font-weight:800}.exportOptions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.exportOption{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px}.exportOption b{display:block;margin-bottom:5px}.exportOption span{font-size:12px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:10px 13px;border-left:0;border-bottom:1px solid var(--line);gap:9px}.brand{padding:2px 5px 8px;border:0}.nav{display:flex;overflow:auto;padding-bottom:3px}.nav button{white-space:nowrap;padding:8px 10px}.sidefoot{display:none}.main{padding:18px 13px 35px}.grid2{grid-template-columns:1fr}}

<body><div class="app"><aside class="side"><div class="brand"><div class="logo">ب</div><div><b>برمجتهالك</b><small>Ambassador Management</small></div></div><nav class="nav" id="nav">
<button data-page="sum" class="active"><span class="ico">▦</span> الملخص</button><button data-page="amb"><span class="ico">♙</span> السفراء</button><button data-page="log"><span class="ico">▤</span> المحتوى والأنشطة</button><button data-page="pay"><span class="ico">◈</span> المدفوعات</button><button data-page="leader"><span class="ico">♧</span> متابعة الليدر</button><button data-page="weekly"><span class="ico">▧</span> التقرير الأسبوعي</button><button data-page="reports"><span class="ico">▧</span> التقارير والتصدير</button><button data-page="history"><span class="ico">↶</span> سجل التعديلات</button><button data-page="cfg"><span class="ico">⚙</span> الإعدادات</button></nav><div class="sidefoot"><div class="local"><span class="dot"></span> يعمل محليًا على هذا الجهاز</div><div id="saveState">الحفظ التلقائي مفعّل</div><div style="margin-top:8px">بياناتك لا تُرسل إلى أي خادم.</div></div></aside>
<main class="main"><header class="top"><div><h1 id="title">الملخص</h1><div class="sub" id="subtitle">نظرة عامة على أداء برنامج السفراء</div></div><div class="toptools"><label class="small muted">شهر الحساب</label><input class="month" type="month" id="month"><button class="iconbtn" id="themeBtn" title="تغيير المظهر">◐</button></div></header><section id="content"></section></main></div><div id="modalroot"></div><div id="toast" class="toast hidden"></div>
<script>

function ymd(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const DEF={month:ymd().slice(0,7),gs:5,top:3,weeklyTarget:0,weekStart:6,monthPrice:225,termPrice:540,acts:[{n:'فيديو',p:100,c:8},{n:'بوست',p:50,c:8},{n:'ستوري',p:15,c:12},{n:'تعليق',p:5,c:20},{n:'مشاركة',p:10,c:10},{n:'تسجيل طالب',p:10,c:30}],bonus:[[0,0],[10000,50],[50000,100],[100000,250],[1000000,500]],prize:[[0,0],[500,50],[1000,125],[2000,300]],lv:[{f:0,n:'سفير جديد',m:150,t:350},{f:25,n:'سفير فضي',m:175,t:375},{f:50,n:'سفير ذهبي',m:200,t:400},{f:100,n:'سفير مميز',m:225,t:450}]};
const S={amb:[],log:[],payments:[],enrollments:[],closures:[],followups:[],objections:[],weeklyReports:[],history:[],cfg:structuredClone(DEF),page:'sum',sel:'',filter:'',query:'',sort:'name',reportMonth:ymd().slice(0,7),reportType:'all',reportAmb:'all'};
let lastSavedState=null,historyBusy=false,fileHandle=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=v=>+v||0, fmt=v=>Math.round(num(v)).toLocaleString('en-US'), uid=()=>Math.random().toString(36).slice(2,11);
const names={sum:['الملخص','نظرة عامة على أداء برنامج السفراء'],amb:['السفراء','إدارة بيانات السفراء واشتراكاتهم'],log:['المحتوى والأنشطة','تسجيل ومراجعة أنشطة السفراء'],pay:['المدفوعات','متابعة المستحقات وسجل عمليات الصرف'],leader:['متابعة الليدر','التارجت الفردي والمتابعة اليومية والتحذيرات والاعتراضات'],weekly:['التقرير الأسبوعي','كشف السفراء وملخص الفريق واعتماد الصرف'],reports:['التقارير والتصدير','استخراج نسخة Excel أو تقارير إدارية'],history:['سجل التعديلات','مراجعة آخر التغييرات والتراجع عنها'],cfg:['الإعدادات','قواعد النقاط والمكافآت والمستويات']};
function tier(a,v){let r=a[0];for(const x of a)if(v>=x[0])r=x;return r}function lvOf(v){let r=S.cfg.lv[0];for(const x of S.cfg.lv)if(v>=x.f)r=x;return r}
// Preserved activity-point rules; subscription groups are now driven by dated student entries.
function weekRange(){const d=new Date(),ws=num(S.cfg.weekStart??6),day=(d.getDay()-ws+7)%7,start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+7);return [ymd(start),ymd(end)]}
function weeklySubs(id){const [a,b]=weekRange();return S.enrollments.filter(e=>e.amb===id&&!e.legacy&&e.date>=a&&e.date<b).reduce((n,e)=>n+num(e.count),0)}
function weeklyStatus(a){if(num(a.warns)>0)return 'خد تحذير';const t=num(a.weeklyTarget??S.cfg.weeklyTarget);return t>0&&weeklySubs(a.id)>=t?'حقق التارجت':'بيحاول'}
function totalStudents(a){return num(a.baseStudents??a.students)+S.enrollments.filter(e=>e.amb===a.id&&!e.legacy).reduce((n,e)=>n+num(e.count),0)}
function studentsBefore(a,month){return num(a.baseStudents??a.students)+S.enrollments.filter(e=>e.amb===a.id&&!e.legacy&&e.date&&e.date.slice(0,7)<month).reduce((n,e)=>n+num(e.count),0)}
function groupProgress(a,kind,month){const c=S.cfg,opening=a.openCarryMonth||'0000-00';if(month<opening)return {groups:0,remainder:0};const events=S.enrollments.filter(e=>e.amb===a.id&&e.kind===kind&&e.date&&e.date.slice(0,7)<=month);const byMonth={};events.forEach(e=>{const m=e.date.slice(0,7)<opening?opening:e.date.slice(0,7);byMonth[m]=(byMonth[m]||0)+num(e.count)});let carry=kind==='month'?num(a.openMonthCarry):num(a.openTermCarry),completed=0;Object.keys(byMonth).sort().forEach(m=>{const total=carry+byMonth[m],groups=Math.floor(total/Math.max(1,num(c.gs)));carry=total-groups*Math.max(1,num(c.gs));if(m===month)completed=groups});return {groups:completed,remainder:carry}}
function compute(){const c=S.cfg,o={log:{},amb:{}};const ok=S.log.filter(x=>x.amb&&x.date&&x.date.slice(0,7)===c.month&&x.status!=='مرفوض').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ord-b.ord);const cnt={},vids={};ok.forEach(x=>{const k=x.amb+'|'+x.type,i=cnt[k]=(cnt[k]||0)+1,ac=c.acts.find(a=>a.n===x.type);o.log[x.id]=ac&&i<=ac.c?ac.p:0;if(x.type===c.acts[0].n)(vids[x.amb]=vids[x.amb]||[]).push(x)});Object.values(vids).forEach(v=>v.sort((a,b)=>num(b.views)-num(a.views)||a.ord-b.ord).slice(0,c.top).forEach(x=>o.log[x.id]+=tier(c.bonus,num(x.views))[1]));S.amb.forEach(a=>{const mine=ok.filter(x=>x.amb===a.id),by=t=>mine.filter(x=>x.type===c.acts[t].n);const pts=mine.reduce((s,x)=>s+o.log[x.id],0),students=totalStudents(a),lv=lvOf(studentsBefore(a,c.month)),revenue=S.enrollments.filter(e=>e.amb===a.id&&!e.legacy).reduce((sum,e)=>sum+num(e.count)*(e.kind==='month'?num(c.monthPrice,225):e.kind==='term'?num(c.termPrice,540):0),0),mg=groupProgress(a,'month',c.month),tg=groupProgress(a,'term',c.month),gm=mg.groups,gt=tg.groups,rew=gm*lv.m+gt*lv.t,prize=tier(c.prize,pts)[1],total=rew+prize,paidSoFar=paidAmount(a.id,c.month),due=Math.max(0,total-paidSoFar),paid=total>0&&due===0;o.amb[a.id]={vids:by(0).length,posts:by(1).length,views:by(0).reduce((s,x)=>s+num(x.views),0),comm:by(3).length,pts,lv:lv.n,students,gm,gt,rew,prize,total,paid,due,paidSoFar,revenue,om:mg.remainder,ot:tg.remainder}});return o}
// IndexedDB primary storage, with localStorage fallback and migration from the previous version.
let db=null,saveTimer=null;function coreState(){return {amb:S.amb,log:S.log,payments:S.payments,enrollments:S.enrollments,closures:S.closures,followups:S.followups,objections:S.objections,weeklyReports:S.weeklyReports,cfg:S.cfg}}function snapshot(){return {...coreState(),history:S.history.slice(-50),version:4}}
function cloneData(x){return JSON.parse(JSON.stringify(x))}function stateStamp(x){return JSON.stringify(x)}function recordHistory(){if(historyBusy||!lastSavedState)return;const now=coreState();if(stateStamp(now)===stateStamp(lastSavedState))return;const before={};for(const k of Object.keys(now))if(JSON.stringify(now[k])!==JSON.stringify(lastSavedState[k]))before[k]=cloneData(lastSavedState[k]);S.history.push({id:uid(),at:new Date().toISOString(),summary:describeChange(lastSavedState,now),before});while(S.history.length>50||(S.history.length>3&&JSON.stringify(S.history).length>3e6))S.history.shift();lastSavedState=cloneData(now)}function describeChange(before,after){for(const k of ['amb','enrollments','log','payments','closures'])if((before[k]||[]).length!==(after[k]||[]).length)return ({amb:'تغيير في قائمة السفراء',enrollments:'تسجيل أو تعديل الطلاب',log:'تعديل المحتوى والأنشطة',payments:'تغيير في المدفوعات',closures:'إغلاق شهر'})[k];if(stateStamp(before.cfg)!==stateStamp(after.cfg))return 'تعديل الإعدادات';return 'تعديل بيانات'}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('BaramgtelakAmbassadors',1);r.onupgradeneeded=()=>r.result.createObjectStore('app');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function migrateLegacy(){S.amb.forEach(a=>{if(a.baseStudents==null)a.baseStudents=num(a.students);if(a.openMonthCarry==null)a.openMonthCarry=num(a.cm);if(a.openTermCarry==null)a.openTermCarry=num(a.ct);if(!a.openCarryMonth)a.openCarryMonth=S.cfg.month;if(!S.enrollments.some(e=>e.amb===a.id&&e.legacy)){if(num(a.m)>0)S.enrollments.push({id:uid(),amb:a.id,date:S.cfg.month+'-01',kind:'month',count:num(a.m),legacy:true,ord:0});if(num(a.t)>0)S.enrollments.push({id:uid(),amb:a.id,date:S.cfg.month+'-01',kind:'term',count:num(a.t),legacy:true,ord:1});}a.m=0;a.t=0;a.cm=0;a.ct=0;a.students=totalStudents(a)});}
async function loadData(){try{db=await openDB();try{fileHandle=await kvGet('fileHandle')||null}catch(e){}const data=await new Promise((res,rej)=>{const r=db.transaction('app','readonly').objectStore('app').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(data){S.amb=data.amb||[];S.log=data.log||[];S.payments=data.payments||[];S.enrollments=data.enrollments||[];S.closures=data.closures||[];S.followups=data.followups||[];S.objections=data.objections||[];S.weeklyReports=data.weeklyReports||[];S.history=data.history||[];S.cfg=Object.assign(structuredClone(DEF),data.cfg||{});}else{let old=null;try{old=JSON.parse(localStorage.getItem('ambS')||'null')}catch{}if(old){S.amb=old.amb||[];S.log=old.log||[];S.cfg=Object.assign(structuredClone(DEF),old.cfg||{});S.closures=old.closures||[];S.followups=old.followups||[];S.objections=old.objections||[];S.weeklyReports=old.weeklyReports||[];S.history=old.history||[];try{const extra=JSON.parse(localStorage.getItem('ambExtra')||'null');if(extra){S.payments=extra.payments||[];S.enrollments=extra.enrollments||[];S.followups=extra.followups||[];S.objections=extra.objections||[];S.weeklyReports=extra.weeklyReports||[]}}catch{}}}migrateLegacy();lastSavedState=cloneData(coreState());await persist();$('#saveState').textContent='الحفظ التلقائي عبر قاعدة بيانات محلية';}catch(e){try{const old=JSON.parse(localStorage.getItem('ambS')||'null');if(old){S.amb=old.amb||[];S.log=old.log||[];S.cfg=Object.assign(structuredClone(DEF),old.cfg||{});}const x=JSON.parse(localStorage.getItem('ambExtra')||'null');if(x){S.payments=x.payments||[];S.enrollments=x.enrollments||[];S.closures=x.closures||[];S.followups=x.followups||[];S.objections=x.objections||[];S.weeklyReports=x.weeklyReports||[];S.history=x.history||[];}migrateLegacy();lastSavedState=cloneData(coreState());}catch{}$('#saveState').textContent='الحفظ المحلي الاحتياطي مفعّل';}}
async function persist(){const data=snapshot();try{if(db)await new Promise((res,rej)=>{const tx=db.transaction('app','readwrite');tx.objectStore('app').put(data,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});if(!db){localStorage.setItem('ambS',JSON.stringify({amb:S.amb,log:S.log,cfg:S.cfg}));localStorage.setItem('ambExtra',JSON.stringify({payments:S.payments,enrollments:S.enrollments,closures:S.closures,followups:S.followups,objections:S.objections,weeklyReports:S.weeklyReports,history:S.history.slice(-10)}))}await writeFile();$('#saveState').textContent='آخر حفظ: '+new Date().toLocaleTimeString('ar-EG')+(S.fileNote?' · '+S.fileNote:'');}catch(e){$('#saveState').textContent='تعذر الحفظ — أنشئ نسخة احتياطية';toast('حصلت مشكلة أثناء الحفظ. صدّر نسخة احتياطية فورًا.')}}
function save(){recordHistory();clearTimeout(saveTimer);saveTimer=setTimeout(persist,120)}function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}

$('#content').addEventListener('change',e=>{const t=e.target;if(t.dataset.col){const o=S[t.dataset.col].find(x=>x.id===t.dataset.id);if(!o)return;if(t.dataset.col==='log'&&t.dataset.field==='link'&&t.value.trim()&&S.log.some(x=>x.id!==o.id&&(x.link||'').trim().toLowerCase()===t.value.trim().toLowerCase())&&!confirm('الرابط ده متسجل قبل كده. الدليل بيحسب كل محتوى مرة واحدة. تكمّل برضه؟')){t.value=o.link||'';return}o[t.dataset.field]=t.type==='number'?(t.value===''?(t.dataset.field==='weeklyTarget'?null:''):+t.value):t.value;save();setTimeout(render,0)}else if(t.id==='logFilter'){S.filter=t.value;render()}else if(t.id==='ambSort'){S.sort=t.value;render()}else if(t.id==='reportMonth'){S.reportMonth=t.value}else if(t.id==='reportType'){S.reportType=t.value}else if(t.id==='reportAmb'){S.reportAmb=t.value}else if(t.id==='restoreFile'){restore(t.files[0])}else if(t.dataset.cfgText){S.cfg[t.dataset.cfgText]=t.value.trim();save();render()}else if(t.dataset.cfg){S.cfg[t.dataset.cfg]=num(t.value);save();render()}else if(t.dataset.actcfg){const [i,f]=t.dataset.actcfg.split('.');S.cfg.acts[+i][f]=f==='n'?t.value:num(t.value);save();render()}else if(t.dataset.bonus){const [i,f]=t.dataset.bonus.split('.');S.cfg.bonus[+i][+f]=num(t.value);save();render()}else if(t.dataset.prize){const [i,f]=t.dataset.prize.split('.');S.cfg.prize[+i][+f]=num(t.value);save();render()}else if(t.dataset.lv){const [i,f]=t.dataset.lv.split('.');S.cfg.lv[+i][f]=f==='n'?t.value:num(t.value);save();render()}});
$('#content').addEventListener('input',e=>{if(e.target.id==='search'){S.query=e.target.value;const pos=e.target.selectionStart;render();const n=$('#search');n?.focus();n?.setSelectionRange(pos,pos)}});
async function restore(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.amb)||!Array.isArray(d.log)||!d.cfg)throw Error('invalid');if(!confirm('استعادة النسخة ستستبدل البيانات الحالية. هل تريد المتابعة؟'))return;S.amb=d.amb;S.log=d.log;S.payments=d.payments||[];S.enrollments=d.enrollments||[];S.closures=d.closures||[];S.followups=d.followups||[];S.objections=d.objections||[];S.weeklyReports=d.weeklyReports||[];S.history=d.history||[];S.cfg=Object.assign(structuredClone(DEF),d.cfg);migrateLegacy();lastSavedState=cloneData(coreState());await persist();render();toast('تمت استعادة النسخة الاحتياطية')}catch(e){alert('ملف النسخة الاحتياطية غير صالح أو غير مكتمل.')}}
(async()=>{if(localStorage.getItem('ambTheme')==='dark')document.documentElement.dataset.theme='dark';await loadData();render()})();

function kvPut(k,v){return new Promise((res,rej)=>{if(!db)return rej();const tx=db.transaction('app','readwrite');tx.objectStore('app').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function kvGet(k){return new Promise((res,rej)=>{if(!db)return res(null);const r=db.transaction('app','readonly').objectStore('app').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function writeFile(){if(!fileHandle)return;try{if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted'){S.fileNote='الملف المربوط محتاج تفعيل من صفحة التقارير';return}const w=await fileHandle.createWritable();await w.write(JSON.stringify({...snapshot(),history:[],exportedAt:new Date().toISOString()}));await w.close();localStorage.setItem('ambLastBackup',ymd());S.fileNote='✓ محفوظ في الملف '+fileHandle.name}catch(e){S.fileNote='تعذر الكتابة في الملف'}}
async function linkFile(){try{if(fileHandle){if(await fileHandle.requestPermission({mode:'readwrite'})==='granted'){await writeFile();toast(S.fileNote);render()}return}
 if(!window.showSaveFilePicker){alert('المتصفح ده مش بيدعم الحفظ في ملف. استخدم Chrome أو Edge.');return}
 fileHandle=await showSaveFilePicker({suggestedName:'ambassadors-data.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});await kvPut('fileHandle',fileHandle);await writeFile();toast(S.fileNote);render()}catch(e){}}

<script>
async function verifyOwnership() {
  const password = prompt("أدخل مفتاح فك شفرة الملكية:");

  if (!password) return;

  try {
    const salt = Uint8Array.from(
      atob("74ooD1ZzpROLfXzmcr4S6A=="),
      c => c.charCodeAt(0)
    );

    const iv = Uint8Array.from(
      atob("pV4+ma/hHIV34gJ5"),
      c => c.charCodeAt(0)
    );

    const encrypted = Uint8Array.from(
      atob("QaEKqI7PIe9DCfVqy66CsURV6APcyYhNjCUh6FLZCP04wH3zl5aYg3XzMbj+3zS+Ne/osqclrThSQXMnCAy0Pi9eaF+fKxE98KxOnj+GeIm+kjIYKiQt"),
      c => c.charCodeAt(0)
    );

    const material = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt,
        iterations: 310000,
        hash: "SHA-256"
      },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const result = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv },
      key,
      encrypted
    );

    const ownership = new TextDecoder().decode(result);

    alert("تم التحقق من بيانات الملكية:\n\n" + ownership);

  } catch (error) {
    alert("مفتاح غير صحيح أو بيانات الملكية تم تعديلها.");
  }
}
</script>
